<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>SistemaPedidos — Mi Asistencia Semanal</title>
</head>
<body data-rol="empleado">

  <header>
    <h1>SistemaPedidos</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="asistencia.html">Asistencia</a>
      <a href="menu-pedido.html">Menú</a>
      <a href="mis-pedidos.html">Mis pedidos</a>
      <a href="mi-perfil.html">Mi perfil</a>
    </nav>
    <p><span data-usuario></span> · <a href="#" data-logout>Cerrar sesión</a></p>
  </header>

  <main>
    <h2>Mi Asistencia Semanal</h2>
    <p>Marcá los días de la semana que vas a asistir a la oficina (podés elegir uno solo o varios).</p>

    <form id="form-asistencia" novalidate>

      <section>
        <label>
          <input type="checkbox" name="dias" value="lunes"> Lunes
        </label>
      </section>

      <section>
        <label>
          <input type="checkbox" name="dias" value="martes"> Martes
        </label>
      </section>

      <section>
        <label>
          <input type="checkbox" name="dias" value="miercoles"> Miércoles
        </label>
      </section>

      <section>
        <label>
          <input type="checkbox" name="dias" value="jueves"> Jueves
        </label>
      </section>

      <section>
        <label>
          <input type="checkbox" name="dias" value="viernes"> Viernes
        </label>
      </section>

      <aside>
        <p>Los cambios impactan sobre el menú de la próxima semana.</p>
      </aside>

      <button type="submit">Confirmar Cambios</button>

    </form>

  </main>

  <footer>
    <small>© 2026 SistemaPedidos</small>
  </footer>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/asistencia.js"></script>
</body>
</html>
