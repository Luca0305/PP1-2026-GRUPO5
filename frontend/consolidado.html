<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Consolidado - SistemaPedidos</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-rol="admin">
    <header class="navbar-admin">
        <div class="logo">SistemaPedidos <span>| Panel Administrador</span></div>
        <div class="user-info">
            <a href="menuadmin.html">Menús</a><a href="calendario-feriados.html">Feriados</a><a href="usuarios.html">Usuarios</a>
      <span data-usuario></span>
            <a href="#" data-logout class="btn-logout">Cerrar Sesión</a>
        </div>
    </header>

    <main class="container-admin">
        <h2>Generar consolidado</h2>
        <p>Revisá los pedidos confirmados de la semana para enviarlos al proveedor.</p>

        <div class="filter-section">
            <div class="nav-semana">
                <button type="button" id="semana-anterior">← Semana anterior</button>
                <span class="semana-label" id="semana-label"></span>
                <button type="button" id="semana-siguiente">Semana siguiente →</button>
                <span id="envio-estado"></span>
            </div>
        </div>

        <table class="table-consolidado">
            <thead>
                <tr>
                    <th>Plato / Opción</th>
                    <th>Cantidad Total</th>
                    <th>Aclaraciones / Restricciones (quién las pidió)</th>
                </tr>
            </thead>
            <tbody id="consolidado-cuerpo"></tbody>
            <tfoot>
                <tr>
                    <td><strong>Total de viandas de la semana:</strong></td>
                    <td colspan="2"><strong id="consolidado-total">0</strong></td>
                </tr>
            </tfoot>
        </table>

        <div class="actions-footer">
            <button type="button" class="btn btn-secondary" id="btn-pdf">Descargar PDF</button>
            <button type="button" class="btn btn-success" id="btn-enviar">Enviar al Proveedor</button>
        </div>
    </main>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/consolidado.js"></script>
</body>
</html>
