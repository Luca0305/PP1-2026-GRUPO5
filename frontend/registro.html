<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>SistemaPedidos — Registro</title>
</head>
<body>

  <header>
    <h1>SistemaPedidos</h1>
    <nav>
      <a href="index.html">Inicio</a>
    </nav>
    <p>Creá tu cuenta para empezar a pedir tu almuerzo</p>
  </header>

  <main>
    <form id="registro-form" novalidate>

      <label for="nombre">Nombre completo</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Tu nombre y apellido"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="tu.usuario@empresa.com"
        required
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        autocomplete="new-password"
      >

      <ul class="reglas-password" id="reglas-password"></ul>
      <p class="fortaleza" id="fortaleza" hidden></p>

      <label for="password-confirm">Confirmar contraseña</label>
      <input
        type="password"
        id="password-confirm"
        name="password-confirm"
        required
        autocomplete="new-password"
      >
      <p class="coincidencia" id="coincidencia" hidden></p>

      <aside>
        <p>Las cuentas nuevas se crean con rol Empleado. El Administrador ya tiene su acceso configurado y no se registra por acá.</p>
      </aside>

      <button type="submit">Crear cuenta</button>

      <a href="login.html">¿Ya tenés cuenta? Iniciá sesión</a>

    </form>
  </main>

  <footer>
    <small>© 2026 SistemaPedidos</small>
  </footer>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/registro.js"></script>
</body>
</html>
