<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>SistemaPedidos — Mi perfil</title>
</head>
<body data-rol="empleado">

  <header>
    <h1>SistemaPedidos</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="asistencia.html">Asistencia</a>
      <a href="menu-pedido.html">Menú</a>
      <a href="mis-pedidos.html">Mis pedidos</a>
      <a href="mi-perfil.html">Mi perfil</a>
    </nav>
    <p><span data-usuario></span> · <a href="#" data-logout>Cerrar sesión</a></p>
  </header>

  <main>
    <h2>Mi perfil</h2>
    <p>Consultá y actualizá tus datos personales.</p>

    <form id="perfil-form" novalidate>

      <label for="nombre">Nombre completo</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        required
      >

      <section class="resumen">
        <h3>Cambiar contraseña <em>(opcional)</em></h3>

        <label for="pass-actual">Contraseña actual</label>
        <input type="password" id="pass-actual" name="pass-actual" placeholder="••••••••">

        <label for="pass-nueva">Nueva contraseña</label>
        <input type="password" id="pass-nueva" name="pass-nueva" placeholder="Mínimo 8 caracteres">

        <label for="pass-confirmar">Confirmar nueva contraseña</label>
        <input type="password" id="pass-confirmar" name="pass-confirmar" placeholder="Repetí la nueva contraseña">
      </section>

      <aside>
        <p>Los cambios se reflejan a partir de tu próximo inicio de sesión.</p>
      </aside>

      <button type="submit">Guardar cambios</button>

    </form>

  </main>

  <footer>
    <small>© 2026 SistemaPedidos</small>
  </footer>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/perfil.js"></script>
</body>
</html>
