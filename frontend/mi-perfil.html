<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4F3B78" />
    <title>Mi perfil · SistemaPedidos</title>
    <link rel="icon" href="assets/img/logo.png" type="image/png" />
    <link
      rel="stylesheet"
      href="assets/vendor/bootstrap/bootstrap-grid.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="mi-perfil" data-required="any">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <header id="app-header" class="app-header">
      <a class="brand" href="login.html">SistemaPedidos</a>
    </header>
    <main id="main" class="main">
      <p id="loading" role="status">Cargando…</p>
      <div
        id="message"
        class="message"
        tabindex="-1"
        role="status"
        hidden
      ></div>
      <div id="reminder" class="note" role="status" hidden></div>
      <div class="page-heading">
        <div>
          <span class="eyebrow">TU CUENTA</span>
          <h1>Mi perfil</h1>
          <p>Mantené tus datos actualizados y elegí una contraseña segura.</p>
        </div>
      </div>
      <section class="panel narrow">
        <form id="profile-form" novalidate>
          <div class="row gx-3">
            <div class="field col-12 col-md-6">
              <label for="name">Nombre(s)</label
              ><input
                id="name"
                name="name"
                type="text"
                required
                maxlength="80"
                autocomplete="given-name"
              />
            </div>
            <div class="field col-12 col-md-6">
              <label for="last-name">Apellido(s)</label>
              <input
                id="last-name"
                name="last-name"
                type="text"
                autocomplete="family-name"
                maxlength="80"
                required
              />
            </div>
          </div>
          <div class="field">
            <label for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              required
              maxlength="254"
              autocomplete="email"
            />
          </div>
          <h2>Cambiar contraseña</h2>
          <p class="help">
            Dejá estos tres campos vacíos si querés conservar tu contraseña.
          </p>
          <div class="field">
            <label for="current-password">Contraseña actual</label
            ><input
              id="current-password"
              name="current-password"
              type="password"
              autocomplete="current-password"
            />
          </div>
          <div class="field">
            <label for="password">Contraseña</label
            ><input
              id="password"
              name="password"
              type="password"
              required
              minlength="8"
              maxlength="64"
              autocomplete="new-password"
              aria-describedby="password-help"
            />
          </div>
          <p id="password-help" class="help" data-password-help></p>
          <div class="field">
            <label for="confirm">Confirmar nueva contraseña</label
            ><input
              id="confirm"
              name="confirm"
              type="password"
              maxlength="64"
              autocomplete="new-password"
            />
          </div>
          <button type="submit">Guardar cambios</button>
        </form>
      </section>
    </main>
    <footer class="app-footer">
      <span>© 2026 SistemaPedidos</span>
    </footer>
    <noscript
      >Activá JavaScript para iniciar sesión y gestionar tus pedidos.</noscript
    >
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
