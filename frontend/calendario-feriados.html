<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4F3B78" />
    <title>Feriados y días sin servicio · SistemaPedidos</title>
    <link rel="icon" href="assets/img/logo.png" type="image/png" />
    <link
      rel="stylesheet"
      href="assets/vendor/bootstrap/bootstrap-grid.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="calendario-feriados" data-required="admin">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <header id="app-header" class="app-header">
      <a class="brand" href="login.html">SistemaPedidos</a>
    </header>
    <main id="main" class="main">
      <p id="loading" role="status">Cargando…</p>
      <div
        id="message"
        class="message"
        tabindex="-1"
        role="status"
        hidden
      ></div>
      <div id="reminder" class="note" role="status" hidden></div>
      <div class="page-heading">
        <div>
          <span class="eyebrow">CALENDARIO DEL COMEDOR</span>
          <h1>Feriados y días sin servicio</h1>
          <p>Definí las fechas en las que no habrá almuerzo para el equipo.</p>
        </div>
      </div>
      <section class="panel narrow">
        <form id="holiday-form" novalidate>
          <div class="field">
            <label for="date">Fecha</label
            ><input id="date" name="date" type="date" required />
          </div>
          <div class="field">
            <label for="reason">Motivo</label
            ><input
              id="reason"
              name="reason"
              type="text"
              required
              maxlength="120"
              placeholder="Ej.: feriado o cierre del comedor"
            />
          </div>
          <button type="submit">Guardar día sin servicio</button>
        </form>
      </section>
      <h2 class="section-title">Fechas registradas</h2>
      <div id="holidays" class="orders"></div>
    </main>
    <footer class="app-footer">
      <span>© 2026 SistemaPedidos</span
      >
    </footer>
    <noscript
      >Activá JavaScript para iniciar sesión y gestionar tus pedidos.</noscript
    >
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
