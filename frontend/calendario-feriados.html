<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Feriados - SistemaPedidos</title>
    <link rel="stylesheet" href="assets/css/styles.css">

<body>

    <!-- Navbar Obligatoria -->

        <div class="brand-section">
            <div class="logo-circle"></div>
            <span>SistemaPedidos</span>
        </div>
        <div class="nav-center">

        </div>
        <div class="nav-links">

            <a href="menu-admin.html">Menús</a>

    <div class="container">
        <h1>Calendario de feriados</h1>
        <p class="subtitle">Gestioná los días en los que no habrá servicio de comedor.</p>

        <!-- Nota Explicativa Obligatoria -->
        <div class="info-box">
            En los días marcados como feriado <strong>no se publica menú ni se reciben pedidos</strong>.
        </div>

        <div class="toolbar">
            <div class="mes-actual">Agosto 2026</div>
            <!-- Botón Opcional -->
            <button class="btn-outline">Cargar los feriados nacionales de una</button>
        </div>

        <p id="calendario-estado" hidden></p>

        <div class="days-grid" id="days-grid-contenido"></div>
    </div>

    <script src="assets/js/calendario-feriados.js"></script>
