<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>SistemaPedidos — Menú + Registrar Pedido</title>
</head>
<body>

  <header>
    <h1>SistemaPedidos</h1>
    <nav>
      <a href="index.html">Inicio</a>
    </nav>
  </header>

  <main>
    <h2>Menú + Registrar pedido</h2>
    <p>Seleccioná una opción por cada día que asistís. El pedido quedará en borrador.</p>

    <form id="form-pedido">

      <section class="menu-semana-wrapper">
        <h3>Menú de la semana — días de asistencia</h3>

        <p id="menu-estado" hidden></p>

        <section class="menu-semana" id="menu-semana-contenido"></section>
      </section>

      <section>
        <label for="comentarios">Comentarios / preferencias alimentarias (opcional)</label>
        <textarea
          id="comentarios"
          name="comentarios"
          placeholder="Ej: sin sal, sin TACC, alergia al maní..."
          maxlength="200">
        </textarea>
      </section>

      <aside>
        <p>Plazo para registrar el pedido: hasta las 10:00 hs de cada día.</p>
      </aside>

      <button type="submit">Guardar pedido</button>

      <section class="resumen">
        <h3>Pedidos registrados en esta sesión</h3>
        <ul class="lista-pedidos-registrados" id="pedidos-lista"></ul>
      </section>

    </form>

  </main>

  <footer>
    <small>© 2026 SistemaPedidos</small>
  </footer>

  <script src="assets/js/menu-pedido.js"></script>
</body>
</html>
