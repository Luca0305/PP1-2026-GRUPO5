<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4F3B78" />
    <title>Iniciar sesión · SistemaPedidos</title>
    <link rel="icon" href="assets/img/logo.png" type="image/png" />
    <link
      rel="stylesheet"
      href="assets/vendor/bootstrap/bootstrap-grid.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="auth-page" data-page="login" data-required="">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <header id="app-header" class="app-header">
      <a class="brand" href="login.html">SistemaPedidos</a>
    </header>
    <main id="main" class="auth-main">
      <p id="loading" role="status">Cargando…</p>
      <div
        id="message"
        class="message"
        tabindex="-1"
        role="status"
        hidden
      ></div>
      <div id="reminder" class="note" role="status" hidden></div>
      <section class="auth-panel" aria-labelledby="auth-title">
        <h1 id="auth-title">Iniciá sesión</h1>
        <p class="auth-description">
          Tu almuerzo, bien organizado. Ingresá con tu cuenta.
        </p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              required
              maxlength="254"
              autocomplete="username"
              placeholder="usuario@mail.com"
            />
          </div>
          <div class="field">
            <label for="password">Contraseña</label
            ><input
              id="password"
              name="password"
              type="password"
              required
              maxlength="64"
              autocomplete="current-password"
              aria-describedby="password-rules"
            />
          </div>
          <ul id="password-rules" class="password-rules"></ul>

          <button class="full" type="submit">
            Iniciar sesión <span aria-hidden="true"></span>
          </button>
        </form>
        <p class="auth-link">
          <a href="recuperar.html">Olvidé mi contraseña</a>
        </p>
        <p class="auth-link">
          ¿Sos nuevo? <a href="registro.html">Registrate</a>
        </p>
      </section>
    </main>
    <footer class="app-footer">
      <span>© 2026 SistemaPedidos</span
      >
    </footer>
    <noscript
      >Activá JavaScript para iniciar sesión y gestionar tus pedidos.</noscript
    >
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
