<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>SistemaPedidos — Login</title>
</head>
<body>

  <header>
    <h1>SistemaPedidos</h1>
    <nav>
      <a href="index.html">Inicio</a>
    </nav>
    <p>Ingresá tus credenciales institucionales</p>
  </header>

  <main>
    <form id="login-form" novalidate>

      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="tu.usuario@empresa.com" 
        required
      >
      <small id="email-error" class="campo-error" role="alert" hidden></small>

      <label for="password">Contraseña</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        required
      >
      <small id="password-error" class="campo-error" role="alert" hidden></small>

      <button type="submit">Iniciar Sesión</button>

      <a href="registro.html">¿Sos nuevo? Solicitá tu cuenta</a>

    </form>
  </main>

  <footer>
    <small>© 2026 SistemaPedidos</small>
  </footer>

  <script src="assets/js/login.js"></script>
</body>
</html>
