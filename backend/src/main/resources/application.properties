spring.application.name=pedidos

# Base creada por el script (backend/db/). Spring no crea ni cambia tablas.
spring.datasource.url=jdbc:mysql://localhost:3306/pp1_pedidos
spring.datasource.username=root
# La contraseña sale de la variable de entorno DB_PASSWORD (nunca se sube al repo).
# Si no existe, queda vacía: es la contraseña por defecto de root en XAMPP.
spring.datasource.password=${DB_PASSWORD:}

# validate: controla que las entidades coincidan con las tablas del script.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
